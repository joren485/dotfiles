---

- name: "Install Vim"
  become: true
  community.general.pacman:
    name:
      - "neovim"

- name: "Create .config/nvim/"
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/nvim/"
    state: "directory"
    mode: "0755"

- name: "Copy init.lua"
  ansible.builtin.copy:
    src: "init.lua"
    dest: "{{ ansible_user_dir }}/.config/nvim/init.lua"
    mode: "0644"
